name: aud_audio_core
description: "Core of the Audanika Audio Engine: the C ABI, buffer and event formats, node contracts, timing contract and OSC message model"
version: 0.0.1
publish_to: none
homepage: https://github.com/audaudio/aud_audio_core
repository: https://github.com/audaudio/aud_audio_core

environment:
  sdk: ^3.12.2

dependencies:
  aud_midi_standard:
    git:
      url: https://github.com/audmidi/aud_midi_standard.git
      tag_pattern: "{{version}}"
    version: ^0.1.0
  code_assets: ^2.1.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.5

dev_dependencies:
  dna_audanika: ^0.0.2
  ffi: ^2.2.0
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  helix: ^1.11.0
  test: ^1.32.0
