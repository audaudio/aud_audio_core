# Run with `dart run ffigen --config ffigen.yaml`.
name: AudAudioCoreBindings
description: |
  Bindings for `src/aud_audio_core.h` and the ABI in `src/aud_abi.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/src/aud_audio_core_bindings_generated.dart'
headers:
  entry-points:
    - 'src/aud_audio_core.h'
    - 'src/aud_abi.h'
  include-directives:
    - 'src/aud_audio_core.h'
    - 'src/aud_abi.h'
ffi-native:
preamble: |
